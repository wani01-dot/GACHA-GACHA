<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f3d8a7"
  >

  <title>ガチャポケット</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

<div class="app">

  <!-- =====================
       HEADER
  ====================== -->

  <header class="header">

    <div class="awning"></div>

    <div class="header-main">

      <div class="logo-area">

        <div class="logo-animal">
          🐹
        </div>

        <div>

          <div class="logo">
            ガチャポケット
          </div>

          <div class="logo-sub">
            GACHA POCKET
          </div>

        </div>

      </div>

      <button
        class="icon-button"
        id="settingsButton"
        type="button"
      >
        ⚙️
      </button>

    </div>

    <!-- 写真 / リスト -->

    <div class="view-switch">

      <button
        class="view-button active"
        id="photoButton"
        type="button"
      >
        ▦ 写真
      </button>

      <button
        class="view-button"
        id="listButton"
        type="button"
      >
        ☷ リスト
      </button>

    </div>

  </header>


  <!-- =====================
       SEARCH
  ====================== -->

  <section class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="🔍 ガチャを検索"
    >

    <button
      id="addButton"
      class="add-button"
      type="button"
      aria-label="ガチャを追加"
    >
      ＋
    </button>

  </section>


  <!-- =====================
       FILTER
  ====================== -->

  <section class="filter-row">

    <button
      class="filter-button active"
      data-filter="all"
      type="button"
    >
      すべて
    </button>

    <button
      class="filter-button yoshino-filter"
      data-filter="よしの"
      type="button"
    >
      よしの
    </button>

    <button
      class="filter-button takeuchi-filter"
      data-filter="たけうち"
      type="button"
    >
      たけうち
    </button>

    <select
      id="sortSelect"
      class="sort-select"
    >

      <option value="new">
        追加順
      </option>

      <option value="release">
        発売日順
      </option>

      <option value="title">
        タイトル順
      </option>

    </select>

  </section>


  <!-- =====================
       CARDS
  ====================== -->

  <main class="content">

    <section
      id="cards"
      class="cards"
    ></section>

    <section
      id="empty"
      class="empty"
      hidden
    >

      <div class="empty-animal">
        🐹
      </div>

      <strong>
        まだ入ってないよ
      </strong>

      <p>
        ＋から気になるガチャを
        ポケットに入れてね
      </p>

    </section>

  </main>

</div>


<!-- =====================
     BOTTOM NAV
====================== -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    type="button"
  >
    <span>🏠</span>
    ホーム
  </button>

  <button
    class="nav-button"
    type="button"
  >
    <span>👥</span>
    ふたりのガチャ
  </button>

  <button
    class="nav-button"
    id="bottomSettings"
    type="button"
  >
    <span>⚙️</span>
    設定
  </button>

</nav>


<!-- =========================================
     ADD SCREEN
========================================== -->

<div
  class="screen-overlay"
  id="addScreen"
  aria-hidden="true"
>

  <section class="form-screen">

    <!-- 駄菓子屋のひさし -->

    <div class="awning"></div>


    <!-- 上部 -->

    <header class="form-header">

      <button
        id="closeAddButton"
        class="back-button"
        type="button"
      >
        ‹
      </button>

      <div>

        <h1>
          ガチャを追加
        </h1>

        <p>
          ポケットに入れておこう
        </p>

      </div>

      <div class="header-hamster">
        🐹
      </div>

    </header>


    <!-- FORM -->

    <form
      id="addForm"
      class="gacha-form"
    >

      <!-- 入力者 -->

      <div class="form-field">

        <label>
          入力した人
        </label>

        <div class="author-buttons">

          <button
            class="author-button yoshino selected"
            data-author="よしの"
            type="button"
          >
            🐹 よしの
          </button>

          <button
            class="author-button takeuchi"
            data-author="たけうち"
            type="button"
          >
            🐹 たけうち
          </button>

        </div>

      </div>


      <!-- 1 -->

      <div class="form-field">

        <label for="titleInput">

          <span class="number">
            1
          </span>

          タイトル

        </label>

        <input
          id="titleInput"
          type="text"
          required
          placeholder="ガチャのタイトルを入力"
        >

      </div>


      <!-- 2 -->

      <div class="form-field">

        <label for="releaseInput">

          <span class="number">
            2
          </span>

          発売日予定

        </label>

        <input
          id="releaseInput"
          type="date"
        >

      </div>


      <!-- 3 IMAGE -->

      <div class="form-field">

        <label>

          <span class="number">
            3
          </span>

          画像

        </label>


        <div class="image-upload">

          <div
            id="imagePlaceholder"
            class="image-placeholder"
          >

            <div class="placeholder-hamster">
              🐹
            </div>

            <div class="placeholder-board">
              まだ入ってないよ
            </div>

            <p>
              写真を選んでね
            </p>

          </div>


          <img
            id="imagePreview"
            class="image-preview"
            alt=""
            hidden
          >


          <label
            class="select-image-button"
            for="imageInput"
          >
            📷 画像を選択
          </label>


          <input
            id="imageInput"
            class="hidden-file"
            type="file"
            accept="image/*"
          >

        </div>

      </div>


      <!-- 4 -->

      <div class="form-field">

        <label for="urlInput">

          <span class="number">
            4
          </span>

          URL

        </label>

        <input
          id="urlInput"
          type="url"
          inputmode="url"
          placeholder="https://x.com/..."
        >

      </div>


      <!-- 5 -->

      <div class="form-field">

        <label for="memoInput">

          <span class="number">
            5
          </span>

          メモ

        </label>

        <textarea
          id="memoInput"
          rows="4"
          placeholder="欲しい種類、見つけた場所など"
        ></textarea>

      </div>


      <!-- SAVE -->

      <button
        class="save-button"
        type="submit"
      >
        🐹 ポケットに入れる
      </button>


      <button
        id="cancelAddButton"
        class="cancel-button"
        type="button"
      >
        キャンセル
      </button>

    </form>

  </section>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>


<script src="./app.js"></script>

</body>
</html>
