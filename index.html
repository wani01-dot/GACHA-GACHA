<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f3d8a7">

  <title>ガチャポケット</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app" class="app">

  <header class="header">

    <div class="awning"></div>

    <div class="header-main">

      <div class="logo-area">

        <div class="capsule-mark small">
          <span></span>
        </div>

        <div>
          <div class="logo">ガチャポケット</div>
          <div class="logo-sub">GACHA POCKET</div>
        </div>

      </div>

      <button
        id="settingsButton"
        class="settings-header-button"
        type="button"
      >
        <span class="setting-mark"></span>
        <span>設定</span>
      </button>

    </div>

    <div class="view-switch">

      <button
        id="photoButton"
        class="view-button active"
        type="button"
      >
        <span class="grid-icon"></span>
        写真
      </button>

      <button
        id="listButton"
        class="view-button"
        type="button"
      >
        <span class="list-icon"></span>
        リスト
      </button>

    </div>

  </header>


  <section class="search-row">

    <div class="search-box">

      <span class="search-symbol"></span>

      <input
        id="searchInput"
        type="search"
        placeholder="ガチャを検索"
        autocomplete="off"
      >

    </div>

    <button
      id="addButton"
      class="add-button"
      type="button"
      aria-label="ガチャを追加"
    >
      ＋
    </button>

  </section>


  <section class="filter-row">

    <button
      class="filter-button"
      data-filter="all"
      type="button"
    >
      すべて
    </button>

    <button
      class="filter-button yoshino"
      data-filter="よしの"
      type="button"
    >
      よしの
    </button>

    <button
      class="filter-button takeuchi"
      data-filter="たけうち"
      type="button"
    >
      たけうち
    </button>

    <select
      id="sortSelect"
      class="sort-select"
    >
      <option value="new">追加順</option>
      <option value="release">発売予定順</option>
      <option value="title">タイトル順</option>
    </select>

  </section>


  <main class="content">

    <section
      id="cards"
      class="cards"
    ></section>

    <section
      id="empty"
      class="empty"
      hidden
    >

      <div class="capsule-mark empty-capsule">
        <span></span>
      </div>

      <strong>まだ入ってないよ</strong>

      <p>
        ＋から気になるガチャを<br>
        ポケットに入れてね
      </p>

    </section>

  </main>

</div>


<!-- =====================================
     追加・編集
===================================== -->

<div
  id="addScreen"
  class="screen-overlay"
  aria-hidden="true"
>

  <div class="form-screen">

    <div class="awning"></div>

    <header class="form-header">

      <button
        id="closeAddButton"
        class="back-button"
        type="button"
        aria-label="戻る"
      >
        ‹
      </button>

      <div class="form-header-title">

        <h1 id="formScreenTitle">
          ガチャを追加
        </h1>

        <p id="formScreenSubtitle">
          ポケットに入れておこう
        </p>

      </div>

      <div class="capsule-mark form-capsule">
        <span></span>
      </div>

    </header>


    <form
      id="addForm"
      class="gacha-form"
    >

      <div class="form-field">

        <label class="field-title">
          入力した人
        </label>

        <div class="author-buttons">

          <button
            class="author-button yoshino"
            data-author="よしの"
            type="button"
          >
            <span class="author-dot"></span>
            よしの
          </button>

          <button
            class="author-button takeuchi"
            data-author="たけうち"
            type="button"
          >
            <span class="author-dot"></span>
            たけうち
          </button>

        </div>

      </div>


      <div class="form-field">

        <label
          class="field-title"
          for="titleInput"
        >
          <span class="number">1</span>
          タイトル
        </label>

        <input
          id="titleInput"
          type="text"
          required
          placeholder="ガチャのタイトルを入力"
        >

      </div>


      <div class="form-field">

        <div class="field-title">
          <span class="number">2</span>
          発売予定
        </div>

        <div class="release-box">

          <div
            id="releaseSelectArea"
            class="release-select-area"
          >

            <label class="release-select-box">

              <span>年</span>

              <select id="releaseYear">
                <option value="">年を選択</option>
              </select>

            </label>


            <label class="release-select-box">

              <span>月</span>

              <select id="releaseMonth">

                <option value="">月を選択</option>

                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>

              </select>

            </label>

          </div>


          <label class="undecided-option">

            <input
              id="releaseUndecided"
              type="checkbox"
            >

            <span class="custom-check"></span>

            <span>発売日未定</span>

          </label>


          <div
            id="releasePreview"
            class="release-preview"
          >
            発売予定を選んでね
          </div>

        </div>

      </div>


      <div class="form-field">

        <div class="field-title">
          <span class="number">3</span>
          画像
        </div>

        <div class="image-upload">

          <div
            id="imagePlaceholder"
            class="image-placeholder"
          >

            <div class="capsule-mark placeholder-capsule">
              <span></span>
            </div>

            <div class="placeholder-board">
              まだ入ってないよ
            </div>

            <p>写真を選んでね</p>

          </div>


          <div
            id="imageSelectedArea"
            class="image-selected-area"
            hidden
          >

            <img
              id="imagePreview"
              class="image-preview"
              alt="選択した画像"
            >

            <button
              id="removeImageButton"
              class="remove-image-button"
              type="button"
            >
              画像を削除して選び直す
            </button>

          </div>


          <label
            id="selectImageButton"
            class="select-image-button"
            for="imageInput"
          >
            <span class="photo-icon"></span>
            画像を選択
          </label>


          <input
            id="imageInput"
            class="hidden-file"
            type="file"
            accept="image/*"
          >

        </div>

      </div>


      <div class="form-field">

        <label
          class="field-title"
          for="urlInput"
        >
          <span class="number">4</span>
          URL
        </label>

        <input
          id="urlInput"
          type="url"
          inputmode="url"
          placeholder="https://x.com/..."
        >

      </div>


      <div class="form-field">

        <label
          class="field-title"
          for="memoInput"
        >
          <span class="number">5</span>
          メモ
        </label>

        <textarea
          id="memoInput"
          rows="4"
          placeholder="欲しい種類、見つけた場所など"
        ></textarea>

      </div>


      <button
        id="saveButton"
        class="save-button"
        type="submit"
      >
        <span class="mini-capsule"></span>
        ポケットに入れる
      </button>


      <button
        id="cancelAddButton"
        class="cancel-button"
        type="button"
      >
        キャンセル
      </button>

    </form>

  </div>

</div>


<!-- =====================================
     詳細
===================================== -->

<div
  id="detailScreen"
  class="screen-overlay"
  aria-hidden="true"
>

  <div class="form-screen detail-screen">

    <div class="awning"></div>

    <header class="form-header">

      <button
        id="closeDetailButton"
        class="back-button"
        type="button"
      >
        ‹
      </button>

      <div class="form-header-title">

        <h1>ガチャ詳細</h1>

        <p>ポケットの中身</p>

      </div>

      <div class="capsule-mark form-capsule">
        <span></span>
      </div>

    </header>


    <main class="detail-content">

      <div
        id="detailImageArea"
        class="detail-image-area"
      ></div>


      <div class="detail-heading-row">

        <span
          id="detailAuthor"
          class="detail-author"
        ></span>

        <span
          id="detailRelease"
          class="detail-release"
        ></span>

      </div>


      <h2
        id="detailTitle"
        class="detail-title"
      ></h2>


      <section class="detail-block">

        <div class="detail-label">
          発売予定
        </div>

        <div
          id="detailDate"
          class="detail-value"
        ></div>

      </section>


      <section class="detail-block">

        <div class="detail-label">
          メモ
        </div>

        <div
          id="detailMemo"
          class="detail-value detail-memo"
        ></div>

      </section>


      <section class="detail-block">

        <div class="detail-label">
          URL
        </div>

        <div
          id="detailUrlText"
          class="detail-url-text"
        ></div>

      </section>


      <button
        id="openUrlButton"
        class="detail-primary-button"
        type="button"
      >
        URLを開く
      </button>


      <button
        id="editButton"
        class="detail-edit-button"
        type="button"
      >
        編集する
      </button>


      <button
        id="deleteButton"
        class="detail-delete-button"
        type="button"
      >
        このガチャを削除
      </button>

    </main>

  </div>

</div>


<!-- =====================================
     設定
===================================== -->

<div
  id="settingsScreen"
  class="screen-overlay"
  aria-hidden="true"
>

  <div class="form-screen">

    <div class="awning"></div>

    <header class="settings-page-header">

      <button
        id="closeSettingsButton"
        class="home-back-button"
        type="button"
      >
        <span class="home-back-icon"></span>
        <span>ホーム</span>
      </button>


      <div class="settings-page-title">

        <div class="settings-title-line">

          <div class="capsule-mark settings-capsule">
            <span></span>
          </div>

          <h1>設定</h1>

        </div>

        <p>
          ガチャポケットを自分好みに
        </p>

      </div>


      <div
        class="settings-header-spacer"
        aria-hidden="true"
      ></div>

    </header>


    <main class="settings-content">

      <section class="settings-card">

        <div class="settings-title">
          あなたはどっち？
        </div>

        <p class="settings-description">
          新しく登録するときの初期選択に使います。
        </p>

        <div class="settings-choice">

          <button
            class="settings-user-button"
            data-user="よしの"
            type="button"
          >
            よしの
          </button>

          <button
            class="settings-user-button"
            data-user="たけうち"
            type="button"
          >
            たけうち
          </button>

        </div>

      </section>


      <section class="settings-card">

        <label
          class="settings-title"
          for="defaultViewSelect"
        >
          最初の表示
        </label>

        <select
          id="defaultViewSelect"
          class="settings-select"
        >
          <option value="photo">
            写真表示
          </option>

          <option value="list">
            リスト表示
          </option>
        </select>

      </section>


      <section class="settings-card">

        <label
          class="settings-title"
          for="defaultSortSelect"
        >
          最初の並び順
        </label>

        <select
          id="defaultSortSelect"
          class="settings-select"
        >
          <option value="new">
            追加順
          </option>

          <option value="release">
            発売予定順
          </option>

          <option value="title">
            タイトル順
          </option>
        </select>

      </section>


      <section class="settings-card stats-card">

        <div>
          <span>登録ガチャ</span>
          <strong id="totalCount">0</strong>
        </div>

        <div>
          <span>よしの</span>
          <strong id="yoshinoCount">0</strong>
        </div>

        <div>
          <span>たけうち</span>
          <strong id="takeuchiCount">0</strong>
        </div>

      </section>


      <button
        id="deleteAllButton"
        class="danger-button"
        type="button"
      >
        すべての登録データを削除
      </button>


      <p class="settings-note">
        ※ 登録データは共有データベースに保存されます。
      </p>

    </main>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- =====================================
     APP
===================================== -->

<script src="./app.js"></script>

</body>
</html>
