<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#f4dfb7"
  />

  <title>ガチャポケット</title>

  <style>
    :root {
      --brown: #432a1a;
      --brown-light: #79583e;

      --cream: #f7ead0;
      --cream-dark: #ead3aa;

      --paper: #fffaf0;

      --red: #d95043;
      --blue: #9bdcf2;
      --pink: #f5b0c1;

      --border: #d3b789;

      --shadow:
        0 3px 10px rgba(73, 44, 24, 0.12);
    }

    * {
      box-sizing: border-box;

      -webkit-tap-highlight-color:
        transparent;
    }

    html {
      background: #b87942;
    }

    body {
      margin: 0;

      color: var(--brown);

      background: #b87942;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 520px;

      min-height: 100dvh;

      margin: 0 auto;

      background:
        linear-gradient(
          #f9efd9,
          #f5e6c8
        );

      position: relative;

      overflow: hidden;

      box-shadow:
        0 0 30px rgba(55, 32, 16, 0.3);
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;

      top: 0;

      z-index: 20;

      background: #f3d8a7;

      border-bottom:
        2px solid #805131;

      box-shadow:
        0 3px 10px rgba(75, 45, 25, 0.1);
    }

    .awning {
      height: 18px;

      background:
        repeating-linear-gradient(
          90deg,

          #c94d40 0,
          #c94d40 28px,

          #f9e7c3 28px,
          #f9e7c3 56px,

          #4388a3 56px,
          #4388a3 84px,

          #f9e7c3 84px,
          #f9e7c3 112px
        );

      border-bottom:
        2px solid #855331;
    }

    .header-main {
      height: 62px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding:
        0 14px;
    }

    .logo-area {
      display: flex;

      align-items:
        center;

      gap: 9px;
    }

    .logo-animal {
      width: 39px;
      height: 39px;

      display: flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        #fff7e7;

      border:
        2px solid #7b4d2e;

      font-size: 23px;
    }

    .logo {
      font-size: 24px;

      font-weight: 950;

      letter-spacing:
        -1px;

      line-height: 1;
    }

    .logo-sub {
      margin-top:
        4px;

      font-size: 8px;

      font-weight: 800;

      letter-spacing:
        2px;

      color:
        #87654a;
    }

    .settings-button {
      width: 42px;
      height: 42px;

      border: 0;

      border-radius:
        50%;

      background:
        rgba(255,255,255,0.55);

      font-size: 21px;
    }

    /* =========================
       VIEW SWITCH
    ========================= */

    .view-switch {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 4px;

      margin:
        0 12px 10px;

      padding: 4px;

      border-radius:
        14px;

      background:
        #e1c496;
    }

    .view-button {
      border: 0;

      padding:
        10px 8px;

      border-radius:
        10px;

      background:
        transparent;

      font-size:
        13px;

      font-weight:
        900;

      color:
        #7d634b;
    }

    .view-button.active {
      background:
        #fff9ec;

      color:
        #257493;

      box-shadow:
        0 2px 5px
        rgba(77, 48, 27, 0.15);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-row {
      display: grid;

      grid-template-columns:
        1fr 46px;

      gap: 8px;

      padding:
        11px 11px 8px;
    }

    .search-input {
      width: 100%;

      min-width: 0;

      border:
        1px solid var(--border);

      border-radius:
        13px;

      padding:
        12px 13px;

      background:
        #fffdf7;

      outline: none;

      font-size:
        14px;
    }

    .add-button {
      width: 46px;
      height: 46px;

      border: 0;

      border-radius:
        50%;

      background:
        var(--red);

      color: white;

      font-size:
        28px;

      font-weight:
        400;

      box-shadow:
        0 3px 0 #a83931;

      display: flex;

      align-items:
        center;

      justify-content:
        center;
    }

    .add-button:active {
      transform:
        translateY(2px);

      box-shadow:
        0 1px 0 #a83931;
    }

    /* =========================
       FILTER
    ========================= */

    .filter-row {
      display: flex;

      align-items:
        center;

      gap: 6px;

      padding:
        0 11px 11px;

      overflow-x:
        auto;

      scrollbar-width:
        none;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex:
        0 0 auto;

      border:
        1px solid #c8aa7b;

      border-radius:
        20px;

      padding:
        7px 11px;

      background:
        #fff8e8;

      font-size:
        11px;

      font-weight:
        900;
    }

    .filter-button.active {
      background:
        #4c3221;

      color: white;

      border-color:
        #4c3221;
    }

    .filter-yoshino {
      background:
        #d9f3fc;
    }

    .filter-takeuchi {
      background:
        #ffe0e7;
    }

    .sort-select {
      flex:
        0 0 auto;

      margin-left:
        auto;

      border:
        1px solid #c8aa7b;

      border-radius:
        20px;

      padding:
        7px 9px;

      background:
        #fff8e8;

      color:
        #604834;

      font-size:
        11px;

      font-weight:
        800;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      padding:
        0 10px 100px;
    }

    /* =========================
       PHOTO GRID
    ========================= */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;
    }

    .gacha-card {
      position:
        relative;

      min-width: 0;

      overflow:
        hidden;

      border:
        1px solid var(--border);

      border-radius:
        14px;

      background:
        var(--paper);

      box-shadow:
        var(--shadow);

      cursor:
        pointer;
    }

    .gacha-image {
      display: block;

      width: 100%;

      aspect-ratio:
        1.38;

      object-fit:
        cover;

      background:
        #ead6ae;
    }

    /* =========================
       NO IMAGE
    ========================= */

    .no-image {
      width: 100%;

      aspect-ratio:
        1.38;

      display: flex;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      background:
        repeating-linear-gradient(
          45deg,

          #f7e8ca 0,
          #f7e8ca 10px,

          #f0dbb8 10px,
          #f0dbb8 20px
        );

      color:
        #60432d;

      font-size:
        11px;

      font-weight:
        900;
    }

    .no-image-animal {
      display: block;

      margin-bottom:
        3px;

      font-size:
        38px;
    }

    .no-image-board {
      display:
        inline-block;

      padding:
        4px 8px;

      border:
        2px solid #765036;

      border-radius:
        5px;

      background:
        #fff1cf;
    }

    /* =========================
       BY BADGE
    ========================= */

    .by-badge {
      position:
        absolute;

      top: 7px;
      right: 7px;

      padding:
        4px 8px;

      border-radius:
        20px;

      border:
        1px solid rgba(255,255,255,0.8);

      box-shadow:
        0 1px 4px
        rgba(0,0,0,0.13);

      font-size:
        9px;

      font-weight:
        950;
    }

    .by-yoshino {
      background:
        var(--blue);
    }

    .by-takeuchi {
      background:
        var(--pink);
    }

    /* =========================
       CARD BODY
    ========================= */

    .card-body {
      padding:
        9px;
    }

    .card-title {
      font-size:
        14px;

      font-weight:
        950;

      line-height:
        1.35;
    }

    .card-date {
      margin-top:
        5px;

      font-size:
        11px;

      font-weight:
        700;
    }

    .card-memo {
      margin-top:
        5px;

      color:
        #745f4d;

      font-size:
        11px;

      line-height:
        1.4;

      display:
        -webkit-box;

      -webkit-line-clamp:
        2;

      -webkit-box-orient:
        vertical;

      overflow:
        hidden;
    }

    /* =========================
       LIST MODE
    ========================= */

    .cards.list-mode {
      display:
        block;
    }

    .list-mode
    .gacha-card {
      display:
        grid;

      grid-template-columns:
        105px minmax(0, 1fr);

      min-height:
        112px;

      margin-bottom:
        9px;
    }

    .list-mode
    .gacha-image,
    .list-mode
    .no-image {
      width:
        105px;

      height:
        100%;

      min-height:
        112px;

      aspect-ratio:
        auto;
    }

    .list-mode
    .card-title {
      padding-right:
        58px;

      font-size:
        15px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding:
        60px 20px;

      text-align:
        center;

      color:
        #826a55;
    }

    .empty-animal {
      font-size:
        48px;
    }

    .empty-title {
      margin-top:
        8px;

      font-size:
        18px;

      font-weight:
        950;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position:
        fixed;

      z-index:
        30;

      bottom:
        0;

      left:
        50%;

      transform:
        translateX(-50%);

      width:
        min(520px, 100%);

      height:
        calc(
          72px +
          env(safe-area-inset-bottom)
        );

      padding-bottom:
        env(safe-area-inset-bottom);

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      background:
        #fff9e9;

      border-top:
        1px solid #cdb58c;

      box-shadow:
        0 -3px 12px
        rgba(69, 43, 24, 0.08);
    }

    .nav-button {
      border: 0;

      background:
        transparent;

      color:
        #735b47;

      font-size:
        10px;

      font-weight:
        850;
    }

    .nav-button span {
      display:
        block;

      margin-bottom:
        3px;

      font-size:
        21px;
    }

    .nav-button.active {
      color:
        #c4483e;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (
      min-width: 700px
    ) {

      body {
        padding:
          25px 0;
      }

      .app {
        min-height:
          calc(100vh - 50px);

        border-radius:
          22px;

        overflow:
          hidden;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="awning"></div>

    <div class="header-main">

      <div class="logo-area">

        <div class="logo-animal">
          🐹
        </div>

        <div>

          <div class="logo">
            ガチャポケット
          </div>

          <div class="logo-sub">
            GACHA POCKET
          </div>

        </div>

      </div>

      <button
        class="settings-button"
        id="settingsButton"
        type="button"
      >
        ⚙️
      </button>

    </div>

    <div class="view-switch">

      <button
        class="view-button active"
        id="photoButton"
        type="button"
      >
        ▦ 写真
      </button>

      <button
        class="view-button"
        id="listButton"
        type="button"
      >
        ☷ リスト
      </button>

    </div>

  </header>

  <section class="search-row">

    <input
      class="search-input"
      id="searchInput"
      type="search"
      placeholder="🔍 ガチャを検索"
    />

    <button
      class="add-button"
      id="addButton"
      type="button"
      aria-label="ガチャを追加"
    >
      ＋
    </button>

  </section>

  <section class="filter-row">

    <button
      class="filter-button active"
      data-filter="all"
      type="button"
    >
      すべて
    </button>

    <button
      class="filter-button filter-yoshino"
      data-filter="よしの"
      type="button"
    >
      よしの
    </button>

    <button
      class="filter-button filter-takeuchi"
      data-filter="たけうち"
      type="button"
    >
      たけうち
    </button>

    <select
      class="sort-select"
      id="sortSelect"
    >

      <option value="new">
        追加順
      </option>

      <option value="release">
        発売日順
      </option>

      <option value="title">
        タイトル順
      </option>

    </select>

  </section>

  <main class="content">

    <section
      class="cards"
      id="cards"
    ></section>

    <section
      class="empty"
      id="empty"
      hidden
    >

      <div class="empty-animal">
        🐹
      </div>

      <div class="empty-title">
        まだ入ってないよ
      </div>

      <p>
        ＋から気になるガチャを
        ポケットに入れてね
      </p>

    </section>

  </main>

</div>

<nav class="bottom-nav">

  <button
    class="nav-button active"
    type="button"
  >
    <span>🏠</span>
    ホーム
  </button>

  <button
    class="nav-button"
    type="button"
  >
    <span>👥</span>
    ふたりのガチャ
  </button>

  <button
    class="nav-button"
    id="bottomSettings"
    type="button"
  >
    <span>⚙️</span>
    設定
  </button>

</nav>

<script>

  /* =========================
     DATA
  ========================= */

  const STORAGE_KEY =
    "gacha-pocket-main";

  const sampleData = [

    {
      id: 1,

      title:
        "ぽてっとハムスター",

      releaseDate:
        "2026-12-01",

      image:
        "",

      url:
        "https://x.com/",

      memo:
        "見つけたら回す！",

      author:
        "よしの",

      createdAt:
        3
    },

    {
      id: 2,

      title:
        "レトロ喫茶マスコット",

      releaseDate:
        "2026-11-01",

      image:
        "",

      url:
        "https://x.com/",

      memo:
        "クリームソーダ狙い",

      author:
        "たけうち",

      createdAt:
        2
    },

    {
      id: 3,

      title:
        "おやすみ動物たち",

      releaseDate:
        "2026-10-01",

      image:
        "",

      url:
        "",

      memo:
        "全部かわいい",

      author:
        "よしの",

      createdAt:
        1
    }

  ];

  let gachas =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) ||
    sampleData;

  let currentFilter =
    "all";

  let viewMode =
    "photo";

  /* =========================
     ELEMENTS
  ========================= */

  const cards =
    document.getElementById(
      "cards"
    );

  const empty =
    document.getElementById(
      "empty"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const sortSelect =
    document.getElementById(
      "sortSelect"
    );

  const photoButton =
    document.getElementById(
      "photoButton"
    );

  const listButton =
    document.getElementById(
      "listButton"
    );

  /* =========================
     ESCAPE
  ========================= */

  function escapeHTML(value) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,

      character => ({

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#039;"

      })[character]
    );

  }

  /* =========================
     SAVE
  ========================= */

  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(gachas)
    );

  }

  /* =========================
     PLACEHOLDER
  ========================= */

  function createPlaceholder() {

    return `
      <div class="no-image">

        <div>

          <span
            class="no-image-animal"
          >
            🐹
          </span>

          <span
            class="no-image-board"
          >
            まだ入ってないよ
          </span>

        </div>

      </div>
    `;

  }

  /* =========================
     CARD
  ========================= */

  function createCard(item) {

    const authorClass =
      item.author ===
      "よしの"

        ? "by-yoshino"

        : "by-takeuchi";

    const imageHTML =
      item.image

        ? `
          <img
            class="gacha-image"
            src="${item.image}"
            alt=""
          />
        `

        : createPlaceholder();

    return `
      <article
        class="gacha-card"
        data-id="${item.id}"
      >

        ${imageHTML}

        <span
          class="
            by-badge
            ${authorClass}
          "
        >
          by
          ${escapeHTML(
            item.author
          )}
        </span>

        <div class="card-body">

          <div class="card-title">

            ${escapeHTML(
              item.title
            )}

          </div>

          <div class="card-date">

            📅

            ${
              item.releaseDate

                ? escapeHTML(
                    item.releaseDate
                  )

                : "発売日未定"
            }

          </div>

          <div class="card-memo">

            ${
              escapeHTML(
                item.memo
              ) ||
              "メモなし"
            }

          </div>

        </div>

      </article>
    `;

  }

  /* =========================
     RENDER
  ========================= */

  function render() {

    const keyword =
      searchInput
        .value
        .trim()
        .toLowerCase();

    let result =
      gachas.filter(
        item => {

          const filterMatch =

            currentFilter ===
            "all"

            ||

            item.author ===
            currentFilter;

          const searchText =
            `
              ${item.title}
              ${item.memo}
              ${item.author}
            `
            .toLowerCase();

          const searchMatch =
            searchText.includes(
              keyword
            );

          return (
            filterMatch &&
            searchMatch
          );

        }
      );

    const sort =
      sortSelect.value;

    result =
      [...result];

    if (
      sort ===
      "release"
    ) {

      result.sort(
        (a, b) =>

          (
            a.releaseDate ||
            "9999"
          )
          .localeCompare(
            b.releaseDate ||
            "9999"
          )
      );

    }

    if (
      sort ===
      "title"
    ) {

      result.sort(
        (a, b) =>

          a.title.localeCompare(
            b.title,
            "ja"
          )
      );

    }

    if (
      sort ===
      "new"
    ) {

      result.sort(
        (a, b) =>

          (
            b.createdAt ||
            0
          )

          -

          (
            a.createdAt ||
            0
          )
      );

    }

    cards.innerHTML =
      result
        .map(createCard)
        .join("");

    empty.hidden =
      result.length !== 0;

    saveData();

  }

  /* =========================
     PHOTO / LIST
  ========================= */

  photoButton.addEventListener(
    "click",
    () => {

      viewMode =
        "photo";

      cards.classList.remove(
        "list-mode"
      );

      photoButton
        .classList
        .add(
          "active"
        );

      listButton
        .classList
        .remove(
          "active"
        );

    }
  );

  listButton.addEventListener(
    "click",
    () => {

      viewMode =
        "list";

      cards.classList.add(
        "list-mode"
      );

      listButton
        .classList
        .add(
          "active"
        );

      photoButton
        .classList
        .remove(
          "active"
        );

    }
  );

  /* =========================
     SEARCH
  ========================= */

  searchInput.addEventListener(
    "input",
    render
  );

  /* =========================
     SORT
  ========================= */

  sortSelect.addEventListener(
    "change",
    render
  );

  /* =========================
     FILTER
  ========================= */

  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            currentFilter =
              button.dataset.filter;

            document
              .querySelectorAll(
                ".filter-button"
              )
              .forEach(
                item => {

                  item.classList
                    .remove(
                      "active"
                    );

                }
              );

            button.classList.add(
              "active"
            );

            render();

          }
        );

      }
    );

  /* =========================
     TEMP BUTTONS
  ========================= */

  document
    .getElementById(
      "addButton"
    )
    .addEventListener(
      "click",
      () => {

        alert(
          "次のステップで追加画面を実装します"
        );

      }
    );

  document
    .getElementById(
      "settingsButton"
    )
    .addEventListener(
      "click",
      () => {

        alert(
          "次のステップで設定画面を実装します"
        );

      }
    );

  document
    .getElementById(
      "bottomSettings"
    )
    .addEventListener(
      "click",
      () => {

        alert(
          "次のステップで設定画面を実装します"
        );

      }
    );

  /* =========================
     START
  ========================= */

  render();

</script>
