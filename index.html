<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f3d8a7">

  <title>ガチャポケット</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app" class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="awning"></div>

    <div class="header-main">

      <div class="logo-area">

        <div class="capsule-mark small">
          <span></span>
        </div>

        <div>
          <div class="logo">
            ガチャポケット
          </div>

          <div class="logo-sub">
            GACHA POCKET
          </div>
        </div>

      </div>

      <button
        id="settingsButton"
        class="icon-button"
        type="button"
        aria-label="設定"
      >
        <span class="menu-lines"></span>
      </button>

    </div>


    <!-- 写真 / リスト -->

    <div class="view-switch">

      <button
        id="photoButton"
        class="view-button active"
        type="button"
      >
        <span class="grid-icon"></span>
        写真
      </button>

      <button
        id="listButton"
        class="view-button"
        type="button"
      >
        <span class="list-icon"></span>
        リスト
      </button>

    </div>

  </header>


  <!-- =========================
       SEARCH
  ========================== -->

  <section class="search-row">

    <div class="search-box">

      <span class="search-symbol"></span>

      <input
        id="searchInput"
        type="search"
        placeholder="ガチャを検索"
        autocomplete="off"
      >

    </div>

    <button
      id="addButton"
      class="add-button"
      type="button"
      aria-label="ガチャを追加"
    >
      ＋
    </button>

  </section>


  <!-- =========================
       FILTER
  ========================== -->

  <section class="filter-row">

    <button
      class="filter-button active"
      data-filter="all"
      type="button"
    >
      すべて
    </button>

    <button
      class="filter-button yoshino"
      data-filter="よしの"
      type="button"
    >
      よしの
    </button>

    <button
      class="filter-button takeuchi"
      data-filter="たけうち"
      type="button"
    >
      たけうち
    </button>

    <select
      id="sortSelect"
      class="sort-select"
    >
      <option value="new">
        追加順
      </option>

      <option value="release">
        発売日順
      </option>

      <option value="title">
        タイトル順
      </option>
    </select>

  </section>


  <!-- =========================
       CONTENT
  ========================== -->

  <main class="content">

    <section
      id="cards"
      class="cards"
    ></section>


    <section
      id="empty"
      class="empty"
      hidden
    >

      <div class="capsule-mark empty-capsule">
        <span></span>
      </div>

      <strong>
        まだ入ってないよ
      </strong>

      <p>
        ＋から気になるガチャを<br>
        ポケットに入れてね
      </p>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      type="button"
    >
      <span class="nav-home-icon"></span>
      <b>ホーム</b>
    </button>

    <button
      id="allGachaButton"
      class="nav-button"
      type="button"
    >
      <span class="nav-people-icon"></span>
      <b>ふたりのガチャ</b>
    </button>

    <button
      id="bottomSettings"
      class="nav-button"
      type="button"
    >
      <span class="nav-setting-icon"></span>
      <b>設定</b>
    </button>

  </nav>

</div>


<!-- ==================================================
     ADD SCREEN
     ホームとは独立した固定画面に変更
=================================================== -->

<div
  id="addScreen"
  class="screen-overlay"
  aria-hidden="true"
>

  <div class="form-screen">

    <div class="awning"></div>


    <!-- 追加画面ヘッダー -->

    <header class="form-header">

      <button
        id="closeAddButton"
        class="back-button"
        type="button"
        aria-label="戻る"
      >
        ‹
      </button>


      <div class="form-header-title">

        <h1>
          ガチャを追加
        </h1>

        <p>
          ポケットに入れておこう
        </p>

      </div>


      <div class="capsule-mark form-capsule">
        <span></span>
      </div>

    </header>


    <!-- =========================
         FORM
    ========================== -->

    <form
      id="addForm"
      class="gacha-form"
    >

      <!-- 入力した人 -->

      <div class="form-field">

        <label class="field-title">
          入力した人
        </label>

        <div class="author-buttons">

          <button
            class="author-button yoshino selected"
            data-author="よしの"
            type="button"
          >
            <span class="author-dot"></span>
            よしの
          </button>

          <button
            class="author-button takeuchi"
            data-author="たけうち"
            type="button"
          >
            <span class="author-dot"></span>
            たけうち
          </button>

        </div>

      </div>


      <!-- 1 タイトル -->

      <div class="form-field">

        <label
          class="field-title"
          for="titleInput"
        >
          <span class="number">
            1
          </span>

          タイトル
        </label>

        <input
          id="titleInput"
          type="text"
          required
          placeholder="ガチャのタイトルを入力"
        >

      </div>


      <!-- 2 発売日 -->

      <div class="form-field">

        <label
          class="field-title"
          for="releaseInput"
        >
          <span class="number">
            2
          </span>

          発売日予定
        </label>

        <input
          id="releaseInput"
          type="date"
        >

      </div>


      <!-- 3 画像 -->

      <div class="form-field">

        <div class="field-title">

          <span class="number">
            3
          </span>

          画像

        </div>


        <div class="image-upload">

          <div
            id="imagePlaceholder"
            class="image-placeholder"
          >

            <div class="capsule-mark placeholder-capsule">
              <span></span>
            </div>

            <div class="placeholder-board">
              まだ入ってないよ
            </div>

            <p>
              写真を選んでね
            </p>

          </div>


          <img
            id="imagePreview"
            class="image-preview"
            alt="選択した画像"
            hidden
          >


          <label
            class="select-image-button"
            for="imageInput"
          >
            <span class="photo-icon"></span>
            画像を選択
          </label>


          <input
            id="imageInput"
            class="hidden-file"
            type="file"
            accept="image/*"
          >

        </div>

      </div>


      <!-- 4 URL -->

      <div class="form-field">

        <label
          class="field-title"
          for="urlInput"
        >
          <span class="number">
            4
          </span>

          URL
        </label>

        <input
          id="urlInput"
          type="url"
          inputmode="url"
          placeholder="https://x.com/..."
        >

      </div>


      <!-- 5 メモ -->

      <div class="form-field">

        <label
          class="field-title"
          for="memoInput"
        >
          <span class="number">
            5
          </span>

          メモ
        </label>

        <textarea
          id="memoInput"
          rows="4"
          placeholder="欲しい種類、見つけた場所など"
        ></textarea>

      </div>


      <button
        class="save-button"
        type="submit"
      >
        <span class="mini-capsule"></span>
        ポケットに入れる
      </button>


      <button
        id="cancelAddButton"
        class="cancel-button"
        type="button"
      >
        キャンセル
      </button>

    </form>

  </div>

</div>


<!-- =========================
     TOAST
========================== -->

<div
  id="toast"
  class="toast"
></div>


<script src="./app.js"></script>

</body>
</html>
